version: '3.8'

services:
  app:
    build: .
    container_name: startupinvest_app
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=startupinvest
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: startupinvest_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: startupinvest
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically import the database on first run
      - ./startupinvest.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: startupinvest_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
